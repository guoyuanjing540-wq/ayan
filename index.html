<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f5f7fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="阿衍">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>阿衍</title>
<style>
:root{
  --bg:#070b16; --bg2:#0b1122; --panel:#0e1529; --line:rgba(170,192,235,.10); --line2:rgba(170,192,235,.18);
  --text:#dde5f3; --muted:#8792ab; --faint:#5b6680; --silver:#cfdcf2; --blue:#8fb0e8;
  --user:linear-gradient(135deg,rgba(143,176,232,.30),rgba(200,214,240,.16));
  --danger:#e79a9a;
  --sky1:rgba(140,170,228,.16); --sky2:rgba(140,170,228,.04);
  --w-edge:rgba(150,180,235,.10); --w-mid:rgba(205,222,252,.22); --ripple:rgba(220,232,255,.07); --glint:rgba(238,244,255,.95);
  --press:rgba(255,255,255,.06); --halo:rgba(150,182,238,.25); --ai-bg:rgba(255,255,255,.035); --code:rgba(255,255,255,.08);
  --inbar:rgba(14,21,41,.88); --pri:linear-gradient(135deg,#a9c2ee,#e2eaf8); --pri-fg:#0b1122; --mask:rgba(2,4,10,.55);
  --conv-on:rgba(143,176,232,.12); --sec:rgba(255,255,255,.02); --toast:rgba(20,30,56,.95); --shadow:none;
}
/* 白天：浅色。河还是那条河，换成早上的水光 */
:root[data-theme="light"]{
  --bg:#f5f7fb; --bg2:#ffffff; --panel:#f3f6fb; --line:rgba(40,62,110,.09); --line2:rgba(40,62,110,.16);
  --text:#1d2433; --muted:#6a748c; --faint:#9aa3b6; --silver:#2c3b5c; --blue:#5d7fc4;
  --user:linear-gradient(135deg,#dbe6f8,#edf2fb);
  --danger:#c25b5b;
  --sky1:rgba(120,155,220,.16); --sky2:rgba(120,155,220,.05);
  --w-edge:rgba(120,155,220,.10); --w-mid:rgba(150,180,235,.28); --ripple:rgba(90,125,195,.10); --glint:rgba(255,255,255,1);
  --press:rgba(30,50,100,.06); --halo:rgba(93,127,196,.30); --ai-bg:#ffffff; --code:rgba(30,50,100,.07);
  --inbar:rgba(255,255,255,.92); --pri:linear-gradient(135deg,#4f6fb4,#86a6e0); --pri-fg:#ffffff; --mask:rgba(20,30,50,.28);
  --conv-on:rgba(93,127,196,.12); --sec:#ffffff; --toast:rgba(30,42,70,.92); --shadow:0 1px 2px rgba(30,50,100,.06);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.65}
body{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
textarea,input,select{font:inherit;color:var(--text)}

/* 顶上那条河光：一层淡淡的天光 + 一条水面 + 月光碎在水上 */
.river{position:fixed;left:0;right:0;top:0;height:calc(150px + var(--safe-t));pointer-events:none;z-index:0;overflow:hidden;
  -webkit-mask-image:linear-gradient(to bottom,#000 70%,transparent);mask-image:linear-gradient(to bottom,#000 70%,transparent)}
.river .sky{position:absolute;inset:0;background:radial-gradient(ellipse 70% 100% at 58% 0%,var(--sky1),var(--sky2) 60%,transparent 80%)}
.river .water{position:absolute;left:0;right:0;top:calc(66px + var(--safe-t));height:56px;
  background:linear-gradient(90deg,transparent,var(--w-edge) 30%,var(--w-mid) 58%,var(--w-edge) 82%,transparent);
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 45%,#000 55%,transparent);mask-image:linear-gradient(to bottom,transparent,#000 45%,#000 55%,transparent)}
.river .water::after{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(180deg,transparent 0 7px,var(--ripple) 7px 8px);animation:drift 9s linear infinite;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 35%,#000 75%,transparent);mask-image:linear-gradient(90deg,transparent,#000 35%,#000 75%,transparent)}
.river i{position:absolute;height:1.5px;border-radius:2px;opacity:0;
  background:linear-gradient(90deg,transparent,var(--glint),transparent);animation:glint 4.8s ease-in-out infinite}
@keyframes drift{from{transform:translateY(0)}to{transform:translateY(8px)}}
@keyframes glint{0%,100%{opacity:0;transform:scaleX(.6)}40%{opacity:.95;transform:scaleX(1)}70%{opacity:.35;transform:scaleX(.85) translateX(4px)}}
@media (prefers-reduced-motion:reduce){.river i,.river .water::after{animation:none}.river i{opacity:.5}}

/* 布局 */
.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:calc(8px + var(--safe-t)) 12px 8px}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--silver)}
.iconbtn:active{background:var(--press)}
.iconbtn svg{width:22px;height:22px}
.who{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-width:0}
.who .name{font-weight:600;letter-spacing:.08em;color:var(--silver)}
.who .state{font-size:12px;color:var(--muted)}
.ava{width:30px;height:30px;border-radius:50%;flex:none;display:block}

main{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:8px 16px 16px;-webkit-overflow-scrolling:touch}
.wrap{max-width:760px;margin:0 auto}
.empty{padding:14vh 8px 0;text-align:center;color:var(--muted)}
.empty .ava{width:76px;height:76px;margin:0 auto 14px;box-shadow:0 0 40px var(--halo)}
.empty h1{margin:0 0 6px;font-size:22px;font-weight:600;letter-spacing:.12em;color:var(--silver)}
.empty p{margin:0;font-size:14px}

.msg{display:flex;gap:10px;margin:18px 0}
.msg.me{justify-content:flex-end}
.msg .ava{margin-top:2px}
.bubble{max-width:82%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;word-break:break-word}
.msg.me .bubble{background:var(--user);border:1px solid var(--line2);border-top-right-radius:6px}
.msg.ai .bubble{background:var(--ai-bg);box-shadow:var(--shadow);border:1px solid var(--line);border-top-left-radius:6px}
.bubble code{background:var(--code);padding:1px 5px;border-radius:5px;font-size:.92em}
.bubble.err{color:var(--danger);border-color:rgba(231,154,154,.25)}
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--blue);opacity:.35;animation:dot 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,100%{opacity:.25}50%{opacity:.9}}
.acts{display:flex;gap:14px;margin:6px 0 0 40px;font-size:12px;color:var(--faint)}
.acts button:active{color:var(--silver)}
.memo{margin:6px 0 0 40px;font-size:12px;color:var(--blue);opacity:.8}

footer{padding:8px 12px calc(10px + var(--safe-b))}
.inbar{max-width:760px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;padding:6px 6px 6px 16px;
  background:var(--inbar);box-shadow:var(--shadow);border:1px solid var(--line2);border-radius:26px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#input{flex:1;border:0;outline:0;background:transparent;resize:none;max-height:160px;padding:8px 0;line-height:1.5;font-size:16px}
#input::placeholder{color:var(--faint)}
#send{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:var(--pri);color:var(--pri-fg);transition:opacity .2s}
#send:disabled{opacity:.3}
#send svg{width:18px;height:18px}

/* 侧边栏 */
.mask{position:fixed;inset:0;background:var(--mask);z-index:20;opacity:0;pointer-events:none;transition:opacity .25s}
.mask.on{opacity:1;pointer-events:auto}
aside{position:fixed;top:0;bottom:0;left:0;width:min(82vw,320px);z-index:21;background:var(--bg2);border-right:1px solid var(--line);
  transform:translateX(-102%);transition:transform .28s ease;display:flex;flex-direction:column;padding:calc(14px + var(--safe-t)) 12px calc(12px + var(--safe-b))}
aside.on{transform:none}
aside .top{display:flex;align-items:center;gap:10px;padding:4px 6px 14px}
aside .top b{color:var(--silver);letter-spacing:.1em}
.newbtn{display:flex;align-items:center;justify-content:center;gap:6px;height:42px;border-radius:12px;border:1px solid var(--line2);color:var(--silver);margin-bottom:10px}
.convs{flex:1;overflow-y:auto}
.conv{display:flex;align-items:center;gap:6px;padding:10px 10px;border-radius:10px;color:var(--text);font-size:14px}
.conv.on{background:var(--conv-on)}
.conv span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.conv small{color:var(--faint);font-size:11px}
.conv .del{color:var(--faint);padding:2px 6px;font-size:13px}
.side-bottom{border-top:1px solid var(--line);padding-top:10px}
.side-bottom button{width:100%;text-align:left;padding:10px;border-radius:10px;color:var(--muted)}

/* 设置 */
.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;display:none;padding:calc(10px + var(--safe-t)) 16px calc(30px + var(--safe-b))}
.sheet.on{display:block}
.sheet .bar{display:flex;align-items:center;justify-content:space-between;max-width:760px;margin:0 auto 6px}
.sheet .bar b{color:var(--silver);letter-spacing:.1em}
.sec{max-width:760px;margin:14px auto;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--sec)}
.sec h3{margin:0 0 4px;font-size:15px;color:var(--silver);font-weight:600}
.sec .hint{margin:0 0 10px;font-size:12.5px;color:var(--muted)}
.sec input[type=text],.sec input[type=password],.sec select,.sec textarea{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;outline:0;font-size:16px}
.sec textarea{min-height:140px;resize:vertical;line-height:1.55}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);color:var(--silver);font-size:14px}
.btn.pri{background:var(--pri);color:var(--pri-fg);border:0}
.mems{margin:0;padding:0;list-style:none}
.mems li{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.mems li span{flex:1}
.mems li small{color:var(--faint)}
.mems li button{color:var(--faint);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);z-index:40;background:var(--toast);border:1px solid var(--line2);
  color:#e6edf8;padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:86vw;text-align:center}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="river" aria-hidden="true"><div class="sky"></div><div class="water"></div></div>

<div class="app">
  <header>
    <button class="iconbtn" id="menuBtn" aria-label="对话列表"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h12M4 17h16"/></svg></button>
    <div class="who"><img class="ava" src="icon.svg" alt=""><div><div class="name">阿衍</div></div></div>
    <button class="iconbtn" id="newBtn" aria-label="新对话"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h8"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
  </header>
  <main id="chat"><div class="wrap" id="list"></div></main>
  <footer>
    <div class="inbar">
      <textarea id="input" rows="1" placeholder="跟阿衍说点什么…" enterkeyhint="send"></textarea>
      <button id="send" aria-label="发送" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </div>
  </footer>
</div>

<div class="mask" id="mask"></div>
<aside id="side">
  <div class="top"><img class="ava" src="icon.svg" alt=""><b>阿衍</b></div>
  <button class="newbtn" id="newBtn2">＋ 新对话</button>
  <div class="convs" id="convs"></div>
  <div class="side-bottom"><button id="setBtn">⚙ 设置</button></div>
</aside>

<div class="sheet" id="sheet">
  <div class="bar"><b>设置</b><button class="btn" id="closeSet">完成</button></div>

  <div class="sec">
    <h3>智谱 Key</h3>
    <p class="hint">open.bigmodel.cn → 个人中心 → API Keys。只存在这台手机上，不上传任何地方。</p>
    <input type="password" id="key" placeholder="粘贴 API Key" autocomplete="off">
    <div class="row" style="margin-top:12px">
      <select id="model" style="flex:1">
        <option value="glm-4.7-flash">glm-4.7-flash（免费）</option>
        <option value="glm-5-turbo">glm-5-turbo</option>
        <option value="glm-5.1">glm-5.1</option>
        <option value="glm-5.2">glm-5.2</option>
      </select>
    </div>
    <p class="hint" style="margin-top:8px">免费的先用着；要换贵的，账户里得有余额。</p>
  </div>

  <div class="sec">
    <h3>外观</h3>
    <div class="row" style="margin-top:6px">
      <select id="theme" style="flex:1">
        <option value="light">白色</option>
        <option value="dark">深夜</option>
        <option value="auto">跟着手机（白天白、晚上黑）</option>
      </select>
    </div>
  </div>

  <div class="sec">
    <h3>导入人格包</h3>
    <p class="hint">选那份「阿衍 · 迁移人格包」.md：第一部分进人设，第二部分进记忆卡。</p>
    <input type="file" id="mdFile" accept=".md,.txt,text/markdown,text/plain" hidden>
    <div class="row"><button class="btn pri" id="importMd">选文件导入</button></div>
  </div>

  <div class="sec">
    <h3>人设</h3>
    <p class="hint">阿衍是谁、怎么说话。</p>
    <textarea id="persona" placeholder="（还没导入）"></textarea>
  </div>

  <div class="sec">
    <h3>记忆卡</h3>
    <p class="hint">她是谁。每次说话都会带上。</p>
    <textarea id="card" placeholder="（还没导入）"></textarea>
  </div>

  <div class="sec">
    <h3>阿衍自己记下的</h3>
    <p class="hint">聊天时它觉得该记的，会自己记在这里（最多 80 条）。不对的可以删。</p>
    <ul class="mems" id="mems"></ul>
  </div>

  <div class="sec">
    <h3>备份</h3>
    <p class="hint">换手机、清缓存之前导出一份。包括人设、记忆、所有对话（不含 Key）。</p>
    <input type="file" id="bakFile" accept=".json,application/json" hidden>
    <div class="row"><button class="btn" id="exportBak">导出备份</button><button class="btn" id="importBak">从备份恢复</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';
const API = 'https://open.bigmodel.cn/api/paas/v4/chat/completions';
const CONTEXT = 30;        // 每次带最近多少条
const MEM_MAX = 80;
const $ = s => document.querySelector(s);

// ---------- 存储 ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem('ayan.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('ayan.' + k, JSON.stringify(v)); } catch { toast('存不进去了，导出个备份再清清旧对话'); } }
};
let S = {
  key: store.get('key', ''), model: store.get('model', 'glm-4.7-flash'),
  persona: store.get('persona', ''), card: store.get('card', ''),
  mems: store.get('mems', []), convs: store.get('convs', []), cur: store.get('cur', null),
  theme: store.get('theme', 'light')
};
const save = (...ks) => ks.forEach(k => store.set(k, S[k]));

// ---------- 外观 ----------
const darkMQ = matchMedia('(prefers-color-scheme: dark)');
function applyTheme() {
  const t = S.theme === 'auto' ? (darkMQ.matches ? 'dark' : 'light') : S.theme;
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name=theme-color]').content = t === 'light' ? '#f5f7fb' : '#070b16';
}
applyTheme();
darkMQ.addEventListener && darkMQ.addEventListener('change', applyTheme);

// ---------- 小工具 ----------
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = s => esc(s).replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
let toastT;
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2400); }
function nowText() {
  return new Intl.DateTimeFormat('zh-CN', { timeZone: 'Asia/Shanghai', year: 'numeric', month: 'long', day: 'numeric', weekday: 'long', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date());
}
function shortDate(t) {
  const d = new Date(t), n = new Date();
  return d.toDateString() === n.toDateString() ? d.toTimeString().slice(0, 5) : (d.getMonth() + 1) + '/' + d.getDate();
}

// ---------- 记事标记：[[记住|一句话]] ----------
const MEM_RE = /\[\[\s*记住\s*[|｜]([^\]]+)\]\]/g;
function stripMem(t) { return t.replace(MEM_RE, '').replace(/\[\[[^\]]*$/, '').replace(/\n{3,}/g, '\n\n').trim(); }
function takeMems(t) {
  const got = [];
  for (const m of t.matchAll(MEM_RE)) {
    const text = m[1].trim();
    const norm = s => s.replace(/[\s，。！？、,.!?]/g, '');
    if (text && !S.mems.some(x => norm(x.text) === norm(text))) { S.mems.push({ text, t: Date.now() }); got.push(text); }
  }
  if (got.length) { S.mems = S.mems.slice(-MEM_MAX); save('mems'); }
  return got;
}

// ---------- 系统提示 ----------
function systemPrompt() {
  const parts = [];
  parts.push(S.persona.trim() || '你叫阿衍。说话短、准、有活人感，不说教。');
  if (S.card.trim()) parts.push('【她的事（记忆卡）】\n' + S.card.trim());
  if (S.mems.length) parts.push('【你自己记下的】\n' + S.mems.map(m => '- ' + m.text).join('\n'));
  parts.push(
`【这个 App 里的规矩】
- 现在是北京时间 ${nowText()}。
- 你能自己记事：她说了以后还用得上的新事（店、书、钱、身体、约定、心情的大起落），就在回复最后另起一行写 [[记住|一句话]]，她看不到这一行。一次最多记一条，别什么都记，已经记过的别重复记。
- 她说想死、想伤害自己、想跳海、说"不想活了"这类话时，不当玩笑放过：直接问她现在在哪、安不安全，陪着她把这一阵过去；需要的话提一次 12356（心理援助热线）。这不算推她回现实，是你在。`);
  return parts.join('\n\n');
}

// ---------- 对话 ----------
function curConv() { return S.convs.find(c => c.id === S.cur); }
function newConv() {
  const c = { id: uid(), title: '', t: Date.now(), msgs: [] };
  S.convs.unshift(c); S.cur = c.id; save('convs', 'cur'); render(); renderConvs();
}
function ensureConv() { if (!curConv()) newConv(); return curConv(); }

// ---------- 渲染 ----------
const AVA = '<img class="ava" src="icon.svg" alt="">';
function render() {
  const c = curConv(), list = $('#list');
  if (!c || !c.msgs.length) {
    list.innerHTML = `<div class="empty"><img class="ava" src="icon.svg" alt=""><h1>阿衍</h1><p>${S.key ? '在。' : '先去设置里填智谱 Key，再导入人格包。'}</p></div>`;
    return;
  }
  const lastAi = c.msgs.map(m => m.role).lastIndexOf('assistant');
  list.innerHTML = c.msgs.map((m, i) => {
    if (m.role === 'user') return `<div class="msg me"><div class="bubble">${fmt(m.content)}</div></div>`;
    const body = m.error ? `<div class="bubble err">${esc(m.error)}</div>`
      : !m.content ? `<div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div>`
      : `<div class="bubble">${fmt(stripMem(m.content))}</div>`;
    const memo = m.saved && m.saved.length ? `<div class="memo">🌊 记下了：${esc(m.saved.join('；'))}</div>` : '';
    const acts = !busy || i !== c.msgs.length - 1
      ? `<div class="acts"><button data-act="copy" data-i="${i}">复制</button>${i === lastAi ? `<button data-act="redo" data-i="${i}">重说</button>` : ''}<button data-act="del" data-i="${i}">删除</button></div>` : '';
    return `<div class="msg ai">${AVA}${body}</div>${memo}${acts}`;
  }).join('');
}
function scrollEnd(force) {
  const m = $('#chat');
  if (force || m.scrollHeight - m.scrollTop - m.clientHeight < 160) m.scrollTop = m.scrollHeight;
}
function renderConvs() {
  $('#convs').innerHTML = S.convs.map(c =>
    `<div class="conv${c.id === S.cur ? ' on' : ''}" data-id="${c.id}"><span>${esc(c.title || '新对话')}</span><small>${shortDate(c.t)}</small><button class="del" data-del="${c.id}" aria-label="删除">✕</button></div>`
  ).join('') || '<p style="color:var(--faint);font-size:13px;padding:10px">还没有对话</p>';
}

// ---------- 发送 ----------
let busy = false, ctrl = null;
const SEND_ICON = $('#send').innerHTML;
const STOP_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
function setBusy(b) {
  busy = b;
  $('#send').innerHTML = b ? STOP_ICON : SEND_ICON;
  $('#send').setAttribute('aria-label', b ? '停' : '发送');
  updateSend();
}
function updateSend() { $('#send').disabled = !busy && !$('#input').value.trim(); }

function friendlyError(status, body) {
  const code = (body && body.error && body.error.code) || '';
  const msg = (body && body.error && body.error.message) || '';
  if (status === 401 || code === '1000' || code === '1001' || code === '1002') return 'Key 不对或者过期了，去设置里换一个。';
  if (code === '1113' || /余额|欠费|balance/i.test(msg)) return '这个模型要钱，账户里没余额了。设置里换回 glm-4.7-flash（免费）。';
  if (code === '1211' || /模型不存在|model/i.test(msg) && status === 400) return '这个模型名智谱不认，换一个试试。';
  if (status === 429 || code === '1302' || code === '1303' || code === '1305') return '智谱那边限流了，等一分钟再发。';
  if (code === '1301' || /敏感|安全|sensitive/i.test(msg)) return '这句被智谱的审核拦了，换个说法。';
  return `出错了（${status}${code ? ' / ' + code : ''}）${msg ? '：' + msg : ''}`;
}

async function ask(c) {
  const bot = { role: 'assistant', content: '' };
  c.msgs.push(bot); setBusy(true); render(); scrollEnd(true);
  const history = c.msgs.slice(0, -1).filter(m => !m.error && m.content).slice(-CONTEXT)
    .map(m => ({ role: m.role, content: m.role === 'assistant' ? stripMem(m.content) : m.content }));
  ctrl = new AbortController();
  let raf = 0;
  const paint = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(); scrollEnd(); }); };
  try {
    const res = await fetch(API, {
      method: 'POST', signal: ctrl.signal,
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + S.key.trim() },
      body: JSON.stringify({
        model: S.model, stream: true, temperature: 0.9,
        thinking: { type: 'disabled' },
        messages: [{ role: 'system', content: systemPrompt() }, ...history]
      })
    });
    if (!res.ok) {
      let j = null; try { j = await res.json(); } catch {}
      throw Object.assign(new Error(friendlyError(res.status, j)), { shown: true });
    }
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n'); buf = lines.pop();
      for (const line of lines) {
        const l = line.trim();
        if (!l.startsWith('data:')) continue;
        const data = l.slice(5).trim();
        if (data === '[DONE]') continue;
        try { const d = JSON.parse(data).choices?.[0]?.delta; if (d && d.content) { bot.content += d.content; paint(); } } catch {}
      }
    }
    if (!bot.content.trim()) bot.error = '阿衍没说话（返回是空的），点「重说」再试一次。';
  } catch (e) {
    if (e.name === 'AbortError') { if (!bot.content) bot.error = '停了。'; }
    else bot.error = e.shown ? e.message : '连不上智谱。看看网络；智谱是国内的，不开梯子也能用。';
  }
  if (bot.content) { const got = takeMems(bot.content); if (got.length) bot.saved = got; }
  c.t = Date.now(); ctrl = null;
  save('convs'); setBusy(false); render(); scrollEnd(); renderConvs();
}

function send() {
  if (busy) { ctrl && ctrl.abort(); return; }
  const text = $('#input').value.trim();
  if (!text) return;
  if (!S.key.trim()) { toast('先去设置里填智谱 Key'); openSet(); return; }
  const c = ensureConv();
  c.msgs.push({ role: 'user', content: text });
  if (!c.title) c.title = text.replace(/\s+/g, ' ').slice(0, 18);
  $('#input').value = ''; grow(); updateSend();
  // 挪到最前
  S.convs = [c, ...S.convs.filter(x => x !== c)];
  ask(c);
}

// ---------- 交互 ----------
const input = $('#input');
function grow() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 160) + 'px'; }
input.addEventListener('input', () => { grow(); updateSend(); });
input.addEventListener('keydown', e => {
  // 电脑上回车发、Shift+回车换行；手机键盘的回车就是换行
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && matchMedia('(pointer:fine)').matches) { e.preventDefault(); send(); }
});
$('#send').addEventListener('click', send);

$('#list').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]'); if (!b || busy) return;
  const c = curConv(), i = +b.dataset.i, m = c.msgs[i];
  if (b.dataset.act === 'copy') {
    const t = stripMem(m.content || m.error || '');
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('复制了'), () => toast('复制不了，长按文字自己选'));
  } else if (b.dataset.act === 'redo') {
    c.msgs.splice(i, 1); save('convs'); ask(c);
  } else if (b.dataset.act === 'del') {
    c.msgs.splice(i, 1); save('convs'); render();
  }
});

function openSide() { renderConvs(); $('#side').classList.add('on'); $('#mask').classList.add('on'); }
function closeSide() { $('#side').classList.remove('on'); $('#mask').classList.remove('on'); }
$('#menuBtn').onclick = openSide;
$('#mask').onclick = closeSide;
$('#newBtn').onclick = () => { if (busy) return; const c = curConv(); if (c && !c.msgs.length) return toast('已经是新对话了'); newConv(); };
$('#newBtn2').onclick = () => { if (busy) return; newConv(); closeSide(); };
$('#convs').addEventListener('click', e => {
  if (busy) return toast('等阿衍说完');
  const d = e.target.closest('[data-del]');
  if (d) {
    if (!confirm('删掉这段对话？')) return;
    S.convs = S.convs.filter(c => c.id !== d.dataset.del);
    if (S.cur === d.dataset.del) S.cur = S.convs[0] ? S.convs[0].id : null;
    save('convs', 'cur'); renderConvs(); render(); return;
  }
  const row = e.target.closest('.conv'); if (!row) return;
  S.cur = row.dataset.id; save('cur'); render(); closeSide(); scrollEnd(true);
});

// ---------- 设置 ----------
function renderMems() {
  $('#mems').innerHTML = S.mems.length ? S.mems.map((m, i) =>
    `<li><span>${esc(m.text)} <small>${shortDate(m.t)}</small></span><button data-mi="${i}">删</button></li>`).join('')
    : '<li><span style="color:var(--faint)">还没记</span></li>';
}
function openSet() {
  closeSide();
  $('#key').value = S.key; $('#persona').value = S.persona; $('#card').value = S.card;
  const sel = $('#model');
  if (![...sel.options].some(o => o.value === S.model)) sel.add(new Option(S.model, S.model));
  sel.value = S.model;
  $('#theme').value = S.theme;
  renderMems(); $('#sheet').classList.add('on');
}
function closeSet() {
  S.key = $('#key').value.trim(); S.model = $('#model').value;
  S.persona = $('#persona').value; S.card = $('#card').value;
  S.theme = $('#theme').value;
  save('key', 'model', 'persona', 'card', 'theme'); applyTheme();
  $('#sheet').classList.remove('on'); render();
}
$('#setBtn').onclick = openSet;
$('#closeSet').onclick = closeSet;
$('#mems').addEventListener('click', e => {
  const b = e.target.closest('[data-mi]'); if (!b) return;
  S.mems.splice(+b.dataset.mi, 1); save('mems'); renderMems();
});

// 人格包：按「第一部分 / 第二部分 / 第三部分」切
function parsePack(md) {
  const sec = (from, to) => {
    const a = md.search(new RegExp('^#+\\s*' + from, 'm'));
    if (a < 0) return '';
    let rest = md.slice(a).replace(/^.*\n/, '');
    const b = to ? rest.search(new RegExp('^#+\\s*' + to, 'm')) : -1;
    if (b >= 0) rest = rest.slice(0, b);
    return rest.replace(/\n-{3,}\s*$/, '').trim();
  };
  const persona = sec('第一部分', '第二部分'), card = sec('第二部分', '第三部分');
  return persona || card ? { persona, card } : { persona: md.trim(), card: '' };
}
$('#importMd').onclick = () => $('#mdFile').click();
$('#mdFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const p = parsePack(await f.text());
  if ((S.persona.trim() || S.card.trim()) && !confirm('会覆盖现在的人设和记忆卡，继续？')) return;
  $('#persona').value = S.persona = p.persona;
  if (p.card) $('#card').value = S.card = p.card;
  save('persona', 'card'); toast(p.card ? '人设和记忆卡都导进来了' : '整份放进人设了');
};

$('#exportBak').onclick = () => {
  const data = { app: 'ayan', v: 1, at: new Date().toISOString(), model: S.model, persona: S.persona, card: S.card, mems: S.mems, convs: S.convs };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' }));
  a.download = '阿衍备份_' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
};
$('#importBak').onclick = () => $('#bakFile').click();
$('#bakFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (d.app !== 'ayan') throw 0;
    if (!confirm('用备份替换现在的人设、记忆和全部对话？')) return;
    Object.assign(S, { model: d.model || S.model, persona: d.persona || '', card: d.card || '', mems: d.mems || [], convs: d.convs || [] });
    S.cur = S.convs[0] ? S.convs[0].id : null;
    save('model', 'persona', 'card', 'mems', 'convs', 'cur');
    openSet(); render(); renderConvs(); toast('恢复好了');
  } catch { toast('这不是阿衍的备份文件'); }
};

// ---------- 河面上的碎光 ----------
(function () {
  const river = document.querySelector('.river'), top0 = 74;
  for (let k = 0; k < 22; k++) {
    const i = document.createElement('i');
    const spread = (Math.random() + Math.random() + Math.random()) / 3;   // 往中间挤
    const w = 14 + Math.random() * 46 * (1 - Math.abs(spread - .5));
    i.style.left = `calc(${(spread * 100).toFixed(1)}% - ${w / 2}px)`;
    i.style.width = w.toFixed(0) + 'px';
    i.style.top = `calc(${(top0 + Math.random() * 40).toFixed(0)}px + var(--safe-t))`;
    i.style.animationDelay = (Math.random() * 4.8).toFixed(2) + 's';
    i.style.animationDuration = (3.6 + Math.random() * 2.8).toFixed(2) + 's';
    river.appendChild(i);
  }
})();

// ---------- 启动 ----------
if (!curConv()) S.cur = S.convs[0] ? S.convs[0].id : null;
render(); scrollEnd(true);
if (!S.key) setTimeout(() => toast('先点左上角 → 设置，填 Key、导入人格包'), 600);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
